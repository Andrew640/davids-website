title: David Thomas MA LRAM ARCO LTCL DipABRSM
description: David is known for his calm and methodical teaching approach. Alongside private tuition for piano, music theory and organ, he is a visiting teacher at Woldingham School. David is also an Accredited Teacher with the Royal College of Organists. Alongside his busy teaching schedule, David is the Director of Music at St. John's Church in Shirley. He directs the choir for the weekly Choral Eucharist.
