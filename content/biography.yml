body: >-
  <p>David is known for his calm and methodical teaching approach. Alongside
  private tuition for piano, music theory and organ based in Sanderstead, South
  Croydon, he is an Accredited Teacher with the Royal College of Organists.
  David is also the Director of Music at St. John's Church in Shirley, Croydon
  where he directs the four-part SATB choir of 18 for the weekly choir practice
  and Sunday Choral Eucharist. David is the Musical Director of the Cantilena
  Singers, based in Sanderstead. He also regularly accompanies choirs on piano
  and organ, including the Oxted and Limpsfield Choral Society where recent
  performances have included Handel's 'Messiah', Rutter's 'Requiem', Karl
  Jenkins 'The Armed Man' and Puccini's 'Messa de Gloria'.</p>
  <p>David graduated from the Royal Academy of Music with an MA in Organ
  Performance and was also awarded the Stephen Bicknell Organ Prize. Whilst at
  the RAM, he studied organ with David Titterington and Anne Marsden Thomas. In
  2016, he became the first recipient of the Dame Gillian Weir Organ
  Scholarship at the Royal Festival Hall. He has also held the Organ
  Scholarship at St. Martin-in-the-Fields in Trafalgar Square. David became a
  Fellow of the Royal College of Organists in May 2021. He also holds the
  Licentiate of the Royal Academy of Music in Organ Teaching, the Licentiate of
  Trinity College London in Organ Performance and the Diploma of the
  Associated Board of the Royal Schools of Music in Piano Performance. Outside
  of music, David enjoys swimming. He is also a private pilot.</p>
  <p><a href="https://www.stjohnsshirley.org.uk/">stjohnsshirley.org.uk</a></p>
  <p><a href="https://www.rco.org.uk/education_find_teacher.php">rco.org.uk/education_find_teacher</a></p>
