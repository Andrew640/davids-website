# Builds the site and uploads it to S3 whenever main changes (including every
# save made in Pages CMS), and once a day to refresh the Google reviews.
name: Deploy

on:
  push:
    branches: [main]
  # Daily rebuild so the Google reviews on the page stay current.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: s3://davidthomasorganist.co.uk
  AWS_REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Optimised images have a content hash in their name, so they can be cached forever.
      - name: Upload optimised images
        run: |
          aws s3 sync _site/img "$BUCKET/img" --size-only \
            --exclude "*.webp" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync _site/img "$BUCKET/img" --size-only \
            --exclude "*" --include "*.webp" --content-type image/webp \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload originals, icons and recordings
        run: |
          aws s3 sync _site/images "$BUCKET/images" --size-only
          aws s3 sync _site/recordings "$BUCKET/recordings" --size-only

      # Uploaded last, once everything it points to is in place.
      - name: Upload page and stylesheet
        run: |
          aws s3 cp _site/style.css "$BUCKET/style.css" --cache-control "public, max-age=300"
          for f in robots.txt sitemap.xml error.html; do
            aws s3 cp "_site/$f" "$BUCKET/$f" --cache-control "public, max-age=3600"
          done
          aws s3 cp _site/index.html "$BUCKET/index.html" --cache-control "no-cache"

      # Set the repo variable CLOUDFRONT_DISTRIBUTION_ID once CloudFront is in front of the bucket.
      - name: Clear CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
